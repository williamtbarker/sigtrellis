# Replace names with your metadata schema before running.
outcome: phenotype
outcome_type: binary
sample_id: sample_id
group: culture_id
batch: batch
permutation_strata: batch
input_scale: counts
normalization: logcpm
candidate_method: variance
max_features: 1000
outer_folds: 5
inner_folds: 3
repeats: 2
strengths: [0.01, 0.05, 0.2]
l1_ratios: [0.2, 0.5, 0.9]
stability_resamples: 50
stability_fraction: 0.75
stability_normalizations: [logcpm, median_ratio]
panel_validation: true
panel_max_features: 20
permutations: 99
selection_threshold: 0.8
sign_threshold: 0.9
outer_selection_threshold: 0.5
seed: 42
