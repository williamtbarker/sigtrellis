[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "sigtrellis"
version = "0.2.0"
description = "Donor-aware, leakage-audited elastic-net transcriptomic signature discovery"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{name = "Will Barker"}]
dependencies = [
  "numpy>=2.0,<3", "pandas>=2.2,<3", "scipy>=1.14,<2",
  "scikit-learn>=1.8,<1.10", "matplotlib>=3.9,<4", "PyYAML>=6,<7",
  "anndata>=0.11,<0.13", "h5py>=3.11,<4", "threadpoolctl>=3.5,<4",
]

[project.optional-dependencies]
de = ["pydeseq2>=0.5.4,<0.6"]
demo = ["rdata>=1.0,<2"]
dev = ["pytest>=8", "pytest-cov>=6", "ruff>=0.11", "mypy>=1.15", "pandas-stubs", "types-PyYAML", "build"]

[project.scripts]
sigtrellis = "sigtrellis.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sigtrellis"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["anndata", "anndata.*"]
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["scientific: controlled scientific validation", "integration: end-to-end or optional backend"]

[tool.coverage.run]
branch = true
source = ["sigtrellis"]
