name: scientific-validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e '.[dev,de,demo]'
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy src
      - run: python -m pytest --cov=sigtrellis --cov-report=xml
      - run: python -m build
      - name: Install wheel outside source tree
        shell: bash
        run: |
          python -m venv /tmp/sigtrellis-wheel
          /tmp/sigtrellis-wheel/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/sigtrellis-wheel/bin/sigtrellis simulate --output ci-toy --samples 24 --features 30
          /tmp/sigtrellis-wheel/bin/sigtrellis bulk --expression ci-toy/counts.tsv --metadata ci-toy/metadata.tsv --config ci-toy/config.yaml --permutations 0 --stability-resamples 2 --output ci-results

